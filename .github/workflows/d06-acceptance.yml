name: AXIS isolated acceptance
on:
  pull_request:
    branches: [main]
  push:
    branches: [d06-verification]
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: axis
          POSTGRES_PASSWORD: axis_test_only
          POSTGRES_DB: axis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U axis -d axis_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      AXIS_TEST_DATABASE_URL: postgresql://axis:axis_test_only@localhost:5432/axis_test
      DATABASE_URL: postgresql://axis:axis_test_only@localhost:5432/axis_test
      VITE_AXIS_USER: usr_alice
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install client from committed lockfile
        working-directory: client
        run: npm ci --no-audit --no-fund
      - name: Install server
        working-directory: server
        run: npm ci --no-audit --no-fund
      - name: Client typecheck
        working-directory: client
        run: npm run typecheck
      - name: Client regression and lost-reply probes
        working-directory: client
        run: npm test
      - name: D21 client affected acceptance
        working-directory: client
        run: npm test -- editor-working-state.test.ts editor-draft-identity.test.ts draft-editor-document.test.tsx draft-paragraph-identity.test.tsx draft.pullback-base.test.tsx shell-compare-page.test.tsx
      - name: Client production build
        working-directory: client
        run: npm run build
      - name: Server build
        working-directory: server
        run: npm run build
      - name: Server regression and earlier probes
        working-directory: server
        run: npm test
      - name: D21 server affected acceptance
        working-directory: server
        run: npm test -- draft-editor-document.schema.test.ts draft-editor-document.test.ts draft-editor-document.api.test.ts proof.draft-editor-document.test.ts
      - name: Migration verification and isolated rollback
        working-directory: server
        run: |
          npm run migrate
          test "$(psql "$DATABASE_URL" -Atc 'SELECT count(*) FROM schema_migrations')" = 17
          psql "$DATABASE_URL" -Atc 'SELECT row_to_json(named_cuts) FROM named_cuts' > "$RUNNER_TEMP/named_cuts-backup.jsonl"
          test "$(wc -l < "$RUNNER_TEMP/named_cuts-backup.jsonl" | tr -d ' ')" = "$(psql "$DATABASE_URL" -Atc 'SELECT count(*) FROM named_cuts')"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'TRUNCATE series CASCADE'
          for f in $(find db/rollback -name '*.down.sql' | sort -r); do
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -1 -f "$f"
          done
          npm run migrate
          test "$(psql "$DATABASE_URL" -Atc 'SELECT count(*) FROM schema_migrations')" = 17
      - name: D06 live preview proxy smoke and graceful shutdown
        run: node .github/scripts/d06-smoke.mjs
      - name: D07 live preview proxy smoke and graceful shutdown
        run: node .github/scripts/d07-smoke.mjs
      - name: D08 live preview proxy smoke and graceful shutdown
        run: node .github/scripts/d08-smoke.mjs
      - name: Install isolated browser verification tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/axis-browser" --no-audit --no-fund playwright@1.51.1
          if browser=$(command -v google-chrome || command -v chromium || command -v chromium-browser); then
            echo "AXIS_BROWSER_EXECUTABLE=$browser" >> "$GITHUB_ENV"
          else
            "$RUNNER_TEMP/axis-browser/node_modules/.bin/playwright" install --with-deps chromium
          fi
      - name: D13 computed responsive and keyboard preview acceptance
        env:
          AXIS_BROWSER_MODULE: ${{ runner.temp }}/axis-browser/node_modules/playwright/index.mjs
        run: node .github/scripts/d13-browser.mjs

      - name: D14 computed snapshot preview acceptance
        env:
          AXIS_BROWSER_MODULE: ${{ runner.temp }}/axis-browser/node_modules/playwright/index.mjs
        run: node .github/scripts/d14-browser.mjs

      - name: D15 computed History lifecycle acceptance
        env:
          AXIS_BROWSER_MODULE: ${{ runner.temp }}/axis-browser/node_modules/playwright/index.mjs
        run: node .github/scripts/d15-browser.mjs

      - name: D18 computed Binder recovery acceptance
        env:
          AXIS_BROWSER_MODULE: ${{ runner.temp }}/axis-browser/node_modules/playwright/index.mjs
        run: node .github/scripts/d18-browser.mjs

      - name: Build the exact D18 predecessor for D19 visual parity
        run: |
          git fetch --no-tags --depth=1 origin 9f00b4a8b83e9f321d03f29003d0f8171d76882a
          git worktree add --detach "$RUNNER_TEMP/axis-d18" 9f00b4a8b83e9f321d03f29003d0f8171d76882a
          npm --prefix "$RUNNER_TEMP/axis-d18/client" ci --no-audit --no-fund
          npm --prefix "$RUNNER_TEMP/axis-d18/client" run build
      - name: D19 computed paragraph and tooltip browser acceptance
        env:
          AXIS_BROWSER_MODULE: ${{ runner.temp }}/axis-browser/node_modules/playwright/index.mjs
          AXIS_D18_CLIENT: ${{ runner.temp }}/axis-d18/client
        run: node .github/scripts/d19-browser.mjs
      - name: Retain D19 browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d19-browser-evidence
          path: ${{ runner.temp }}/axis-d19-browser
          if-no-files-found: ignore
